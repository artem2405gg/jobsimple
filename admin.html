<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель</title>
</head>
<body>
  <h1>Добавить вакансию</h1>
  <form method="post">
    <input name="title" placeholder="Должность" required>
    <input name="city" placeholder="Город">
    <input name="salary" placeholder="Зарплата">
    <input name="employment" placeholder="Тип занятости">
    <button type="submit">Добавить</button>
  </form>

  <h2>Текущие вакансии</h2>
  <ul>
    {% for v in vacancies %}
      <li>{{ v.title }} — <a href="/vacancy/{{ v.id }}/delete">Удалить</a></li>
    {% endfor %}
  </ul>
</body>
</html>
